apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: capstone-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: capstone-api
    spec:
      containers:
      - name: capstone-api
        image: bikudas8deakin/capstone-api:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: capstone-api
spec:
  type: LoadBalancer
  selector:
    app: capstone-api
  ports:
  - port: 80
    targetPort: 8080
